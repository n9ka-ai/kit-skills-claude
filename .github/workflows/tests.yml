name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  skills:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Vérifier les skills
        run: python tests/verifier.py
